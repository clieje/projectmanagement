<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aanvraag — Clience</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'><rect width='1' height='1' fill='%23000'/></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap">
<style>
:root{
  --black:#000000; --dark:#131313; --card:#1f1f1f; --line:#2c2c2c;
  --grey:#818180;  --light:#efeeec; --white:#ffffff; --green:#0ba954;
  --ease:cubic-bezier(.65,.05,0,1);
  --f-text:"neue-haas-grotesk-text","DM Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-disp:"neue-haas-grotesk-display","DM Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{
  min-height:100vh; background:var(--dark); color:var(--light);
  font-family:var(--f-text); font-size:16px; line-height:1.5;
  display:flex; flex-direction:column; align-items:center;
  padding:48px 20px 72px;
}
.sheet{
  width:100%; max-width:520px;
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:32px;
}
.top{
  display:flex; justify-content:space-between; align-items:flex-start;
  font-size:13px; color:var(--grey); margin-bottom:36px;
}
.logo{font-family:var(--f-disp);color:var(--light);letter-spacing:-.01em;font-weight:500}
.voor{font-size:13px;color:var(--grey);margin-bottom:6px}
.titel{
  font-family:var(--f-disp); font-size:24px; line-height:1.25;
  font-weight:500; letter-spacing:-.02em; margin-bottom:28px; text-wrap:balance;
}
.sectie-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--grey);margin-bottom:10px}
.werk{list-style:none;border-top:1px solid var(--line);padding-top:14px}
.werk li{
  display:flex;align-items:flex-start;gap:11px;justify-content:space-between;
  padding:9px 0;font-size:14px;color:var(--light);border-bottom:1px solid var(--line);
}
.werk li:last-child{border-bottom:none}
.werk li::before{
  content:'';width:4px;height:4px;border-radius:50%;
  background:var(--grey);flex-shrink:0;margin-top:7px;
}
.rows{border-top:1px solid var(--line);padding-top:14px;margin-top:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:16px;padding:7px 0;font-size:15px}
.row dt{color:var(--grey)} .row dd{color:var(--light);font-variant-numeric:tabular-nums}
.datum-balk{
  display:flex;justify-content:space-between;align-items:center;
  border:1px solid var(--line);border-radius:8px;padding:10px 14px;
  font-size:14px;margin-bottom:6px;
}
.datum-balk span:first-child{color:var(--grey)}
.datum-balk span:last-child{color:var(--light);font-variant-numeric:tabular-nums}
.vergelijking{
  background:var(--dark);border-radius:10px;padding:14px 16px;
  margin-bottom:28px;font-size:14px;color:var(--grey);line-height:1.55;
}
.vergelijking b{color:var(--light);font-weight:500}
.acties{display:flex;gap:10px;margin-bottom:16px}
.acties button{
  flex:1;padding:14px 12px;border-radius:10px;font:inherit;font-size:15px;cursor:pointer;
  transition:background .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease);
}
.ja{background:var(--light);color:var(--black);border:1px solid var(--light)}
.ja:hover{background:var(--white)}
.nee{background:none;color:var(--light);border:1px solid var(--line)}
.nee:hover{border-color:var(--grey)}
button:focus-visible{outline:2px solid var(--light);outline-offset:2px}
.geldig{font-size:12px;color:var(--grey)}
.klaar{display:none} .klaar.actief{display:block}
.sheet.afgerond .form{display:none}
.stip{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle}
.stip.groen{background:var(--green)} .stip.grijs{background:var(--grey)}
.klaar h2{
  font-family:var(--f-disp);font-size:20px;font-weight:500;
  letter-spacing:-.02em;margin-bottom:10px;
}
.klaar p{font-size:15px;color:var(--grey);margin-bottom:24px;line-height:1.55}
.terug{
  background:none;border:none;color:var(--grey);font:inherit;font-size:13px;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0;
}
.terug:hover{color:var(--light)}
/* Loading / error */
.laad{padding:40px 0;font-size:14px;color:var(--grey)}
/* Omschrijving */
.omschrijving{font-size:14px;color:var(--grey);line-height:1.6;margin-top:-14px;margin-bottom:24px}
/* Rush */
.rush-sectie{margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.rush-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--grey);margin-bottom:8px}
.rush-knoppen{display:flex;gap:8px}
.rush-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:11px 8px;border-radius:10px;border:1px solid var(--line);
  background:none;color:var(--light);font:inherit;cursor:pointer;
  transition:border-color .2s var(--ease),background .2s var(--ease);
}
.rush-btn:hover{border-color:var(--grey)}
.rush-btn.actief{border-color:var(--light);background:rgba(255,255,255,.05)}
.rush-btn .rush-titel{font-size:13px}
.rush-toeslag{font-size:11px;color:var(--grey)}
/* Naam invoer */
.naam-wrap{margin-bottom:16px}
.naam-wrap label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--grey);display:block;margin-bottom:8px}
.naam-input{width:100%;background:none;border:1px solid var(--line);border-radius:10px;color:var(--light);font:inherit;font-size:15px;padding:13px 14px;transition:border-color .2s var(--ease);outline:none;box-sizing:border-box}
.naam-input::placeholder{color:var(--grey)}
.naam-input:focus{border-color:var(--grey)}
.naam-btns{display:flex;gap:10px;margin-top:10px}
.naam-btns button{flex:1;padding:14px 12px;border-radius:10px;font:inherit;font-size:15px;cursor:pointer;border:none;transition:background .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease)}
/* Klaar samenvatting */
.klaar-samenvatting{margin-top:20px;border-top:1px solid var(--line);padding-top:14px}
.klaar-sum-rij{display:flex;justify-content:space-between;gap:16px;padding:7px 0;font-size:14px;border-bottom:1px solid var(--line)}
.klaar-sum-rij:last-child{border-bottom:none}
.klaar-sum-rij dt{color:var(--grey);flex-shrink:0}
.klaar-sum-rij dd{color:var(--light);text-align:right;font-variant-numeric:tabular-nums}
.klaar-werklist{list-style:none;margin:0 0 14px;padding:0;border-bottom:1px solid var(--line);padding-bottom:4px}
.klaar-werklist li{font-size:13px;color:var(--grey);padding:5px 0;display:flex;gap:8px;line-height:1.4}
.klaar-werklist li::before{content:'';width:3px;height:3px;border-radius:50%;background:var(--grey);flex-shrink:0;margin-top:6px}
.disclaimer{font-size:12px;color:var(--grey);margin:8px 0 0;line-height:1.5}
.disclaimer a{color:var(--grey);text-underline-offset:3px;text-decoration:underline}
.disclaimer a:hover{color:var(--light)}
@media(max-width:600px){
  body{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
  .sheet{padding:24px 20px}
  .titel{font-size:21px}
  .acties{
    position:fixed;bottom:0;left:0;right:0;
    flex-direction:row;
    margin-bottom:0;
    padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);
    background:linear-gradient(to bottom,transparent 0%,var(--dark) 30%);
    z-index:100;
  }
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
const SB_URL = 'https://bmcrndoevdhtxlrrokru.supabase.co';
const SB_KEY = 'sb_publishable_IfuIVIup7uSuIwA6rTid2A_yeEk1-Yz';
const HEADERS = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' };

const el = id => document.getElementById(id);
const sheet = el('sheet');
let huidigToken = null;
let huidigVariant = 'los';
let huidigDatum = null;
let huidigDatumOrigineel = null;
let huidigPrijsRaw = null;
let huidigRush = null;
let huidigData = null;
let huidigNaam = '';

const MAANDEN = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
function parseDatumNL(s) {
  if (!s) return null;
  const parts = (s+'').trim().split(/\s+/);
  if (parts.length < 2) return null;
  const dag = parseInt(parts[0]);
  const mIdx = MAANDEN.indexOf(parts[1].toLowerCase());
  if (isNaN(dag) || mIdx < 0) return null;
  const jaar = parts[2] ? parseInt(parts[2]) : new Date().getFullYear();
  return new Date(jaar, mIdx, dag);
}
const DAGEN_AFG = ['zo','ma','di','wo','do','vr','za'];
function datumMetCountdown(s) {
  if (!s) return escHtml(s||'');
  const d = parseDatumNL(s);
  if (!d) return escHtml(s);
  const dagStr = DAGEN_AFG[d.getDay()] + ' ' + s;
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((d - today) / 86400000);
  if (diff <= 0) return escHtml(dagStr);
  const countdown = diff === 1 ? 'morgen' : 'over ' + diff + ' dagen';
  return '<span style="color:var(--grey);font-size:12px;margin-right:8px">' + countdown + '</span>'
       + escHtml(dagStr);
}

function parsePrijs(raw) {
  let s = (raw+'').replace(/[€\s]/g,'');
  if (s.includes(',') && s.includes('.')) {
    s = s.replace(/\./g,'').replace(',','.');
  } else if (s.includes(',')) {
    s = s.replace(',','.');
  } else if (s.includes('.')) {
    const parts = s.split('.');
    if (parts.length === 2 && parts[1].length === 3)
      s = parts.join('');
  }
  return parseFloat(s);
}

function formatPrijs(raw) {
  if (!raw) return '';
  const n = parsePrijs(raw);
  if (isNaN(n)) return raw+'';
  return '€ ' + n.toLocaleString('nl-NL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function showView(name) {
  ['loadingView','errorView','eerderView','mainView'].forEach(v =>
    el(v).style.display = v === name ? '' : 'none'
  );
}

async function laadVoorstel() {
  const token = new URLSearchParams(window.location.search).get('t');
  if (!token) { showView('errorView'); return; }
  huidigToken = token;

  try {
    const res = await fetch(
      `${SB_URL}/rest/v1/proposals?token=eq.${encodeURIComponent(token)}&select=*&limit=1`,
      { headers: HEADERS }
    );
    const [p] = await res.json();
    if (!p) { showView('errorView'); return; }

    if (p.status !== 'pending') {
      renderEerder(p);
      return;
    }
    renderVoorstel(p);
  } catch(e) {
    showView('errorView');
  }
}

function renderVoorstel(p) {
  huidigData = p.task_data;
  const d = p.task_data;
  document.title = `Aanvraag ${d.number || ''} — Clience`;

  el('aanvraagNr').textContent  = `Aanvraag ${d.number || ''}`;
  el('voor').textContent        = `Voor ${d.clientName || ''}`;
  el('titel').textContent       = d.title || '';
  huidigDatum = d.datum || null;
  huidigDatumOrigineel = d.datum || null;
  huidigRush = null;
  if (el('rushStdDatum')) el('rushStdDatum').textContent = d.datum || 'Conform planning';
  const rawVal = parsePrijs(d.prijs || d.creditPrijs || '');
  huidigPrijsRaw = isNaN(rawVal) ? null : rawVal;
  if (d.description) {
    el('omschrijving').textContent = d.description;
    el('omschrijving').style.display = '';
  } else {
    el('omschrijving').style.display = 'none';
  }

  // Client logo
  if (d.clientLogo) {
    el('clientLogoImg').src = d.clientLogo;
    el('clientLogoWrap').style.display = '';
  }

  // Werkzaamheden
  const items = (d.items || []).filter(i => i && (typeof i === 'string' ? i : i.text));
  if (items.length) {
    const hasPrices = items.some(i => typeof i === 'object' && i.price);
    const werkEl = el('werk');
    werkEl.innerHTML = items.map(i => {
      const text  = typeof i === 'string' ? i : i.text;
      const price = typeof i === 'object' && i.price ? i.price : null;
      return `<li>
        <span style="flex:1">${escHtml(text)}</span>
        ${hasPrices && price ? `<span style="font-variant-numeric:tabular-nums;color:var(--grey);flex-shrink:0">${escHtml(formatPrijs(price))}</span>` : hasPrices ? `<span style="color:var(--line)">—</span>` : ''}
      </li>`;
    }).join('');
    el('werkLabel').style.display = '';
    werkEl.style.display = '';
  }

  // Bepaal variant op basis van sla
  const sla = d.sla;
  if (!sla) {
    huidigVariant = 'los';
    el('prijsLabel').textContent = 'Bedrag';
    el('prijs').textContent      = formatPrijs(d.prijs);
    if (d.datum) el('datum').innerHTML = datumMetCountdown(d.datum);
    else el('datumRij').style.display = 'none';
    if (d.vergelijking) {
      el('vergelijking').innerHTML     = d.vergelijking;
      el('vergelijking').style.display = '';
    }
    if (d.geldig) {
      el('geldig').textContent     = d.geldig;
      el('geldig').style.display   = '';
    }
    if (p.expires_at) {
      const dagen = Math.ceil((new Date(p.expires_at) - Date.now()) / 86400000);
      if (dagen > 0) {
        el('vervalTekst').textContent = `Vervalt automatisch over ${dagen} dag${dagen === 1 ? '' : 'en'}`;
        el('vervalTekst').style.display = '';
      }
    }
  } else {
    huidigVariant = sla === 'plus' ? 'support' : 'bereikbaar';
    el('prijsLabel').textContent = 'Bedrag';
    el('prijs').textContent      = formatPrijs(d.creditPrijs || d.prijs);
    if (d.datum) el('datum').innerHTML = datumMetCountdown(d.datum);
    else el('datumRij').style.display = 'none';
    if (d.vergelijking) {
      el('vergelijking').innerHTML     = d.vergelijking;
      el('vergelijking').style.display = '';
    }
  }

  showView('mainView');
}

function renderEerder(p) {
  const d = p.task_data;
  el('eerderNr').textContent = `Aanvraag ${d.number || ''}`;
  const goedgekeurd = p.status === 'approved';
  el('eerderStip').className   = 'stip ' + (goedgekeurd ? 'groen' : 'grijs');
  el('eerderTitel').textContent = goedgekeurd ? 'Goedgekeurd' : 'Niet nu';
  el('eerderTekst').textContent = goedgekeurd
    ? 'Bedankt — ik ga ermee aan de slag.'
    : 'Helder, ik laat het liggen. Stuur me een bericht als je het later toch wilt.';
  renderEerderDetail(p);
  showView('eerderView');
}

function renderEerderDetail(p) {
  const d = p.task_data;
  const items = (d.items || []).filter(i => i && (typeof i === 'string' ? i : i.text));
  let html = '';
  if (d.title) html += `<h2 style="font-family:var(--f-disp);font-size:18px;font-weight:500;letter-spacing:-.02em;color:var(--light);margin:0 0 6px">${escHtml(d.title)}</h2>`;
  if (d.description) html += `<p style="font-size:14px;color:var(--grey);margin:0 0 16px;line-height:1.55">${escHtml(d.description)}</p>`;
  if (items.length) {
    html += '<ul class="klaar-werklist">';
    html += items.map(i => {
      const text = typeof i === 'string' ? i : i.text;
      return `<li>${escHtml(text)}</li>`;
    }).join('');
    html += '</ul>';
  }
  html += '<dl>';
  const prijsTxt = el('prijs') ? el('prijs').textContent : '';
  if (prijsTxt) html += `<div class="klaar-sum-rij"><dt>Bedrag</dt><dd>${escHtml(prijsTxt)}<br><span style="font-size:11px;color:var(--grey)">Exclusief btw</span></dd></div>`;
  if (p.rush) html += `<div class="klaar-sum-rij"><dt>Levertijd</dt><dd>${escHtml(p.rush)}</dd></div>`;
  if (d.datum) html += `<div class="klaar-sum-rij"><dt>Opleverdatum</dt><dd>${escHtml(d.datum)}</dd></div>`;
  if (p.respondent_name) html += `<div class="klaar-sum-rij"><dt>Akkoord door</dt><dd>${escHtml(p.respondent_name)}</dd></div>`;
  html += '</dl>';
  const det = el('eerderDetail');
  det.innerHTML = html;
  det.style.display = '';
}

function goedTekst() {
  if (huidigVariant === 'bereikbaar' || huidigVariant === 'support')
    return 'Ik pak het op, morgen staat het live. Je ziet het terug in je maandoverzicht.';
  return 'Ik heb het ingepland. Je hoort het van me zodra het live staat.';
}

function kiesRush(tier, btn) {
  document.querySelectorAll('.rush-btn').forEach(b => b.classList.remove('actief'));
  if (btn) btn.classList.add('actief');

  if (tier === 'std') {
    if (huidigPrijsRaw) el('prijs').textContent = formatPrijs(String(huidigPrijsRaw));
    if (huidigDatumOrigineel) {
      el('datum').innerHTML = datumMetCountdown(huidigDatumOrigineel);
      el('datumRij').style.display = '';
    } else {
      el('datumRij').style.display = 'none';
    }
    huidigDatum = huidigDatumOrigineel;
    huidigRush = null;
    return;
  }

  const multiplier = tier === '3d' ? 1.5 : 2.0;
  const label      = tier === '3d' ? 'Binnen 3 werkdagen' : 'Binnen 24 uur';
  const toeslag    = tier === '3d' ? '50%' : '100%';
  if (huidigPrijsRaw) {
    el('prijs').textContent = formatPrijs(String(huidigPrijsRaw * multiplier));
  }
  el('datum').textContent = label;
  el('datumRij').style.display = '';
  huidigDatum = label;
  huidigRush = `Rush ${toeslag} — ${label}`;
}

async function afronden(soort) {
  el('ja').disabled = el('nee').disabled = true;
  document.querySelectorAll('.rush-btn').forEach(b => b.disabled = true);
  const url = `${SB_URL}/rest/v1/proposals?token=eq.${encodeURIComponent(huidigToken)}`;
  try {
    const patchBody = { status: soort === 'ja' ? 'approved' : 'declined', responded_at: new Date().toISOString() };
    if (soort === 'ja' && huidigNaam) patchBody.respondent_name = huidigNaam;
    if (soort === 'ja' && huidigRush) patchBody.rush = huidigRush;
    await fetch(url, { method: 'PATCH', headers: HEADERS, body: JSON.stringify(patchBody) });
  } catch(e) { /* toon toch de bevestiging */ }

  if (soort === 'ja') {
    const now = new Date();
    const datum = now.toLocaleDateString('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' });
    const tijd  = now.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
    el('klaarDatumTijd').textContent = datum + ' om ' + tijd;
    if (huidigDatum) {
      el('klaarOpleverdatum').textContent = 'Opleverdatum: ' + huidigDatum;
      el('klaarOpleverdatum').style.display = '';
    } else {
      el('klaarOpleverdatum').style.display = 'none';
    }
    el('klaarBanner').style.display = '';
    el('klaarH2').style.display = 'none';
    el('klaarTekst').textContent = 'Bedankt voor de opdracht. Wij zullen deze direct inplannen.';
    el('klaarTekst').style.display = '';
    renderKlaarSamenvatting();
  } else {
    el('stip').className = 'stip grijs';
    el('klaarTitel').textContent = 'Niet nu';
    el('klaarBanner').style.display = 'none';
    el('klaarH2').style.display = '';
    el('klaarTekst').style.display = '';
    el('klaarTekst').textContent = 'Helder, ik laat het liggen. Wil je het later toch, stuur me dan een bericht — dan kijk ik opnieuw naar de planning.';
  }
  sheet.classList.add('afgerond');
  el('klaar').classList.add('actief');
}

function reset() {
  sheet.classList.remove('afgerond');
  el('klaar').classList.remove('actief');
  el('klaarBanner').style.display = 'none';
  el('klaarH2').style.display = 'none';
  el('klaarTekst').style.display = '';
  el('klaarSamenvatting').style.display = 'none';
  el('naamWrap').style.display = 'none';
  el('actiesWrap').style.display = '';
  el('ja').disabled = el('nee').disabled = false;
  el('naamBevestig').disabled = el('naamTerug').disabled = false;
  document.querySelectorAll('.rush-btn').forEach(b => { b.disabled = false; b.classList.remove('actief'); });
  const rushStd = document.getElementById('rushStd');
  if (rushStd) rushStd.classList.add('actief');
  huidigRush = null;
  huidigNaam = '';
}

function renderKlaarSamenvatting() {
  const d = huidigData;
  if (!d) return;
  const items = (d.items || []).filter(i => i && (typeof i === 'string' ? i : i.text));
  let html = '';

  if (d.title) {
    html += '<h2 style="font-family:var(--f-disp);font-size:18px;font-weight:500;letter-spacing:-.02em;color:var(--light);margin:0 0 8px;line-height:1.3">'
      + escHtml(d.title) + '</h2>';
  }
  if (d.description) {
    html += '<p style="font-size:14px;color:var(--grey);line-height:1.55;margin:0 0 14px">'
      + escHtml(d.description) + '</p>';
  }

  if (items.length) {
    html += '<p style="font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--grey);margin-bottom:8px">Werkzaamheden</p>';
    html += '<ul class="klaar-werklist">';
    html += items.map(i => '<li>' + escHtml(typeof i === 'string' ? i : i.text) + '</li>').join('');
    html += '</ul>';
  }

  html += '<dl>';
  const prijsTxt = el('prijs').textContent;
  if (prijsTxt) {
    html += '<div class="klaar-sum-rij"><dt>Bedrag</dt><dd>' + escHtml(prijsTxt)
      + '<br><span style="font-size:11px;color:var(--grey)">Exclusief btw</span></dd></div>';
  }
  if (huidigRush) {
    html += '<div class="klaar-sum-rij"><dt>Levertijd</dt><dd>' + escHtml(huidigRush) + '</dd></div>';
  }
  const opleverdatum = huidigDatum;
  if (opleverdatum) {
    html += '<div class="klaar-sum-rij"><dt>Opleverdatum</dt><dd>' + escHtml(opleverdatum) + '</dd></div>';
  }
  if (huidigNaam) {
    html += '<div class="klaar-sum-rij"><dt>Akkoord door</dt><dd>' + escHtml(huidigNaam) + '</dd></div>';
  }
  html += '</dl>';

  const sam = el('klaarSamenvatting');
  sam.innerHTML = html;
  sam.style.display = '';
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

el('ja').addEventListener('click', () => {
  el('naamInput').value = localStorage.getItem('clience-naam') || '';
  el('actiesWrap').style.display = 'none';
  el('naamWrap').style.display = '';
  setTimeout(() => {
    el('naamInput').focus();
    el('naamInput').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 50);
});
el('nee').addEventListener('click', () => afronden('nee'));
el('naamTerug').addEventListener('click', () => {
  el('naamWrap').style.display = 'none';
  el('actiesWrap').style.display = '';
});
el('naamBevestig').addEventListener('click', () => {
  const naam = el('naamInput').value.trim();
  if (!naam) {
    el('naamInput').style.borderColor = 'var(--green)';
    el('naamInput').focus();
    return;
  }
  el('naamInput').style.borderColor = '';
  localStorage.setItem('clience-naam', naam);
  huidigNaam = naam;
  afronden('ja');
});
el('naamInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') el('naamBevestig').click();
});
el('terug').addEventListener('click', reset);

laadVoorstel();
</script>
</body>
</html>
